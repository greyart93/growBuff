services:
  db:
    image: pgvector/pgvector:pg16
    container_name: growbuff-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: growbuff
      POSTGRES_PASSWORD: growbuff
      POSTGRES_DB: growbuff
    ports:
      - "5432:5432"
    volumes:
      - growbuff-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growbuff -d growbuff"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  growbuff-pgdata:
